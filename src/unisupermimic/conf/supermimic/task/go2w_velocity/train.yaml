# @package _global_
# Standalone formal H8 configuration.
algo:
  algo: supermimic
  algo_log_name: supermimic
  load_run: '-1'
  checkpoint: -1
  resume: false
  seed: 2026
  num_envs: 4096
  iterations: 12000
  buffer_steps: 1024
  utd: 0.4
  horizon: 8
  goal_frames: 1
  hist: 5
  z_dim: 32
  wm_hidden:
  - 2048
  - 2048
  - 2048
  wm_structured: true
  policy_hidden:
  - 2048
  - 1024
  - 512
  - 256
  critic_hidden:
  - 256
  - 128
  wm_window: 8
  wm_batches: 10
  wm_batch: 2048
  pi_batch: 2048
  lr: 0.0004
  pi_opt: adam
  wm_opt: adam
  no_sync: false
  pi_ema: 0.0
  gamma: 0.99
  lam: 0.95
  action_noise: 0.02
  critic_epochs: 5
  critic_minibatches: 4
  no_critic: false
  warmup_steps: 64
  wm_only_iters: 0
  lr_decay_iters: 250000
  ckpt_every: 2000
  log_every: 50
  log_backend: tensorboard
  amp: none
  compile: false
  test_hidden_dims: null
  goal_mode: direct
  terrain_training: true
  terrain_conditioning: true
  terrain_sensor_grad: true
  critic_terrain_conditioning: true
  profile: true
  strict_finite: true
  checkpoint_replay: true
  command_start_weights:
  - 0.06
  - 0.2
  - 0.12
  - 0.26
  - 0.2
  - 0.16
  actor_domain_weights: [0.40, 0.10, 0.08, 0.08, 0.12, 0.10, 0.08, 0.04]
  actor_lr_scale: 0.05
  actor_ramp_iters: 1000
  history_capacity: 8192
  history_fraction: 0.5
  wm_lr_scale: 0.1
env:
  seed: 2026
  sim_dt: 0.005
  ctrl_dt: 0.02
  max_episode_seconds: 10.0
  auto_reset: true
  scale_rewards_by_dt: false
  scene:
    model_file: src/unisupermimic/assets/robots/go2w/terrain_robot.xml
    default_keyframe_name: init_state
    entities:
      robot:
        root_body_name: robot/base
        body_names:
        - robot/base
        joint_names:
        - robot/FL_hip_joint
        - robot/FL_thigh_joint
        - robot/FL_calf_joint
        - robot/FR_hip_joint
        - robot/FR_thigh_joint
        - robot/FR_calf_joint
        - robot/RL_hip_joint
        - robot/RL_thigh_joint
        - robot/RL_calf_joint
        - robot/RR_hip_joint
        - robot/RR_thigh_joint
        - robot/RR_calf_joint
        - robot/FL_wheel_joint
        - robot/FR_wheel_joint
        - robot/RL_wheel_joint
        - robot/RR_wheel_joint
        actuator_names:
        - robot/FL_hip_joint
        - robot/FL_thigh_joint
        - robot/FL_calf_joint
        - robot/FR_hip_joint
        - robot/FR_thigh_joint
        - robot/FR_calf_joint
        - robot/RL_hip_joint
        - robot/RL_thigh_joint
        - robot/RL_calf_joint
        - robot/RR_hip_joint
        - robot/RR_thigh_joint
        - robot/RR_calf_joint
        - robot/FL_wheel_joint
        - robot/FR_wheel_joint
        - robot/RL_wheel_joint
        - robot/RR_wheel_joint
        geom_names:
        - robot/FL_wheel_collision
        - robot/FR_wheel_collision
        - robot/RL_wheel_collision
        - robot/RR_wheel_collision
  observations:
    policy:
      enable_corruption: false
      terms:
        proprio:
          func: unisupermimic.tasks.velocity.go2w.manager_terms.observation
  actions:
    mixed:
      _target_: unisupermimic.tasks.velocity.go2w.manager_terms.Go2WMixedActionCfg
      entity_name: robot
      control:
        dt: 0.02
        leg_position_scale: 0.25
        leg_kp: 40.0
        leg_kd: 1.0
        wheel_kp: 0.0
        wheel_kd: 0.5
        wheel_velocity_scale: 15.0
        leg_effort_limits:
        - 23.7
        - 23.7
        - 45.43
        - 23.7
        - 23.7
        - 45.43
        - 23.7
        - 23.7
        - 45.43
        - 23.7
        - 23.7
        - 45.43
        wheel_effort_limits:
        - 15.0
        - 15.0
        - 15.0
        - 15.0
        full_leg_target_range: true
        leg_limit_fraction: 0.95
  commands:
    velocity:
      _target_: unisupermimic.tasks.velocity.go2w.manager_terms.VelocityCommandCfg
      terrain_profile: mixed
      terrain_curriculum: true
      terrain_fixed_level: 0
      terrain_max_level: 9
      terrain_phase: skill
      terrain_min_episodes: 3
      terrain_target_progress: 1.2
      terrain_recycle_probability: 0.15
      terrain_coverage_weights:
      - 0.2
      - 0.25
      - 0.2
      - 0.15
      - 0.1
      - 0.06
      - 0.03
      - 0.01
      spawn_height: 0.42
      sampler:
