            - 0.25
          - - -0.6
            - 0.6
        terrain_velocity_ranges:
        - - - -0.2
            - 0.6
          - - -0.15
            - 0.15
          - - -0.35
            - 0.35
        - - - 0.15
            - 0.55
          - - -0.08
            - 0.08
          - - -0.2
            - 0.2
        - - - 0.15
            - 0.55
          - - -0.08
            - 0.08
          - - -0.2
            - 0.2
        - - - 0.2
            - 0.45
          - - -0.03
            - 0.03
          - - -0.1
            - 0.1
        - - - 0.2
            - 0.45
          - - -0.03
            - 0.03
          - - -0.1
            - 0.1
      reward:
        track_vx: 3.0
        track_vy: 3.0
        track_yaw: 2.5
        sigma_x: 0.25
        sigma_y: 0.2
        sigma_yaw: 0.35
        zero_speed_baseline: true
        stand_still: 0.25
        stop_command_sigma: 0.05
        stop_velocity_sigma: 0.15
        terrain_alignment: 1.0
        terrain_alignment_sigma: 0.16
        max_target_tilt_deg: 35.0
        base_lin_vel_z:
        - -0.5
        - -0.35
        - -0.15
        - -0.15
        - -0.08
        - -0.08
        base_ang_vel_xy: -0.15
        base_height_low: -40.0
        min_safe_height: 0.25
        leg_joint_deviation:
        - -0.02
