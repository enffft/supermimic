        domain_weights:
        - 0.4
        - 0.15
        - 0.075
        - 0.075
        - 0.15
        - 0.15
        flat_mode_weights:
        - 0.06
        - 0.2
        - 0.12
        - 0.26
        - 0.2
        - 0.16
        flat_speed_level: 0
        flat_hold_range:
