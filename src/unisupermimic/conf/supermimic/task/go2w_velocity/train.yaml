        - 5.0
        terrain_hold_seconds: 10.02
        seed: 2026
        stairs_omni: false
        flat_velocity_levels:
        - - - -0.25
            - 0.6
          - - -0.25
            - 0.25
          - - -0.6
            - 0.6
        - - - -0.25
            - 0.6
          - - -0.25
            - 0.25
          - - -0.6
            - 0.6
        - - - -0.25
            - 0.6
